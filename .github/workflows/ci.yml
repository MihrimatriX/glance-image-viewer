name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true   # corpus/raw sample for the RAW tests
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build src/Glance.App -c Release -r win-x64
      - run: dotnet build src/Glance.App -c Release -r win-arm64
      - run: dotnet test --solution Glance.slnx -c Release
