name: release

# Push a tag like v0.2.0 -> GitHub Release with a per-user installer and a portable zip, for x64 and ARM64.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Publish (self-contained, trimmed, with Explorer thumbnail handler)
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$v" >> $env:GITHUB_ENV
          # NativeAOT linking of the thumbnail DLL needs vswhere on PATH.
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/Glance.App -c Release -r win-${{ matrix.arch }} -p:Version=$v -o out/Glance
          Get-ChildItem out/Glance -Recurse -Filter *.pdb | Remove-Item

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive out/Glance/* "out/Glance-$env:VERSION-${{ matrix.arch }}-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source ?? "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$env:VERSION /DArch=${{ matrix.arch }} /DSourceDir=..\out\Glance installer\Glance.iss

      - uses: actions/upload-artifact@v7
        with:
          name: glance-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*-setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
