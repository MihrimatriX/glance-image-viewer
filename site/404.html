<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Glance</title>
<meta name="robots" content="noindex">
<!-- Served for any missing path, at any depth: links must be absolute. -->
<link rel="icon" href="https://mihrimatrix.github.io/glance-image-viewer/logo.svg" type="image/svg+xml">
<style>
  :root { --paper: #F4F5F7; --ink: #1A1C22; --graphite: #5D626D; --accent: #4F52D9; }
  @media (prefers-color-scheme: dark) { :root { --paper: #15171C; --ink: #ECEDEF; --graphite: #9BA0AA; --accent: #A3A6FF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px 16px; text-align: center;
         font: 17px/1.6 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--graphite); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <h1>Page not found</h1>
  <p>Sayfa bulunamadı.</p>
  <p><a href="https://mihrimatrix.github.io/glance-image-viewer/">Back to Glance</a></p>
</body>
</html>
